services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:${VERSION_TAG}
    container_name: heimdall
    restart: unless-stopped
    networks: 
      - simplarr-stack_network
    environment:
      - PUID=${GLOBAL_PUID}
      - PGID=${GLOBAL_PGID}
      - TZ=${GLOBAL_TIMEZONE}
      - ALLOW_INTERNAL_REQUESTS=false #optional
    volumes:
      - ${DOCKERROOTPATH}/${CONTAINER_NAME}/config:/config
    ports:
      - ${HEIMDALL_HTTP_PORT}:80
      - ${HEIMDALL_HTTPS_PORT}:443
    restart: unless-stopped

networks:
  simplarr-stack_network:
    name: ${SIMPLARR_NETWORK}
    driver: bridge